on:
  push:
    branches:
      - main

jobs:
  my_job:
    name: kitex gen
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: '1.18'

      - name: Install Kitex
        run: go install github.com/cloudwego/kitex/tool/cmd/kitex@latest

      - name: Generate Kitex code
        run: kitex -module core core.thrift

      - name: Configure git
        run: |
          git config --global user.name 'wxl'
          git config --global user.email '1715142548@qq.com'

      - name: Reset to empty repository
        run: |
          git rm -rf .
          rm -rf .

      - name: Commit empty state
        run: git commit --allow-empty -m 'Reset to empty repository'

      - name: Commit generated code
        run: |
          git checkout -b gen
          git add kitex_gen/*
          git add go.mod
          git commit -m 'Generate Kitex code'

      - name: Push to another repository
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        run: git push --force origin gen