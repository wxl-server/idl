on:
  push:
    branches:
      - main

jobs:
  my_job:
    name: kitex gen
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: '1.18'

      - name: Install Kitex
        run: go install github.com/cloudwego/kitex/tool/cmd/kitex@latest

      - name: Generate Kitex code
        run: kitex -module core core.thrift

      - name: Configure git
        run: |
          git config --global user.name 'wxl'
          git config --global user.email '1715142548@qq.com'

      - name: Commit generated code
        run: |
          git add kitex_gen/*
          git add go.mod
          git commit -m 'Generate Kitex code'

      - name: GitHub Push
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.TOKEN }}  # 传递 GitHub Token
          repository:  # 目标仓库名称，默认是当前仓库
          branch: gen-rpc  # 目标分支，默认是 master
          force: true  # 是否强制推送
          tags: false  # 是否推送标签
          directory: | # 推送前切换的目录，默认是当前目录
            kitex_gen/*
            go.mod