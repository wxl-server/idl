on:
  push:
    branches: [ "*" ]
    paths:
      - 'rpc_idl/**'

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Trigger Kitex Gen
          run: |
            branch=$(echo ${{ github.event.ref }} | awk -F '/' '{print $3}')
            token=${{ secrets.TOKEN }}
            repo=${{ github.repository }}
            commit_msg=${{ github.event.head_commit.message }}
            # 检查是否存在 HEAD^
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              idls=$(git diff --name-only HEAD^ HEAD | grep -E 'rpc_idl/.*\.thrift$')
            else
              idls=$(git diff --name-only HEAD | grep -E 'rpc_idl/.*\.thrift$')
            fi
            sh ./trigger.sh
            if [ -z "$idls" ]; then
              echo "No .thrift files have been modified."
              exit 0
            fi

            # 遍历每个 .thrift 文件
            for idl in $idls; do
              echo "Going to trigger code gen: $idl"
              # 在这里添加处理每个 IDL 文件的逻辑
              # 发送请求
              curl -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $token" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/qcq1/rpc_$idl/dispatches \
              -d '{"event_type":"idl_update","client_payload":{"repository":"'$repo'","ref":"'$branch'","commit_msg":"'$commit_msg'","idl":"'$idl'"}}'
            done